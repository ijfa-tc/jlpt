<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="only light">
<meta name="theme-color" content="#ffffff">
<title>JLPT 模擬試験｜IJFA</title>
<meta name="description" content="JLPT の模擬試験（N5〜N3）。マークシート形式で、本番と同じ時間・流れで練習できます。IJFA トレーニングセンター作成。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDMincho:wght@400;700&display=swap">
<style>
*{box-sizing:border-box}
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:system-ui,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
/* Layout: one narrow exam-paper column; question paper above, the answer-sheet row pinned to the bottom like a strip torn from the real sheet. */
:root{
  --paper:#f6f7f5; --sheet-bg:#ffffff; --ink:#1c2125; --muted:#5b646c; --rule:#d5dad6;
  --sheet:#1c2125; --sheet-soft:#eceeec; --accent:#22385a; --accent-ink:#ffffff;
  --ok:#2e7a4e; --ng:#b3261e; --ok-soft:#e3f1e8; --ng-soft:#f8e2e0;
  --f-paper:"BIZ UDMincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
/* いつも 白い 背景（スマホが ダークモードでも 黒く しない） */
html,body{height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.6}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--sheet-bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 140px}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--sheet-bg);border-bottom:1px solid var(--rule)}
header.bar .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sec{font-weight:700;font-size:14px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.timer{font-variant-numeric:tabular-nums;font-size:14px;color:var(--muted)}
.timer.low{color:var(--ng);font-weight:700}
button{font:inherit;cursor:pointer}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.danger{background:transparent;border-color:var(--ng);color:var(--ng)}
.btn.danger.fill{background:var(--ng);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.btn:focus-visible,.bub:focus-visible,.row:focus-visible{outline:3px solid var(--sheet);outline-offset:2px}
.small{padding:6px 10px;font-size:13px}

/* question paper */
.paper{font-family:var(--f-paper);background:var(--sheet-bg);border:1px solid var(--rule);border-radius:4px;padding:18px 16px;margin-top:16px}
.mondai{display:flex;gap:10px;align-items:baseline;margin-bottom:12px}
.mondai b{border:1.5px solid var(--ink);padding:0 8px;font-size:15px;white-space:nowrap}
.mondai p{margin:0;font-size:calc(14px*var(--z,1));line-height:2}
.qnum{font-family:var(--f-ui);font-weight:700;display:inline-block;min-width:1.6em;border:1.5px solid var(--ink);text-align:center;margin-right:8px;font-size:13px;line-height:1.5}
/* 分かち書きなしの 文でも 自然に 折りかえす（keep-all は 使わない） */
.stem{font-size:calc(19px*var(--z,1));line-height:2.2;margin:6px 0 14px;word-break:normal;line-break:strict;overflow-wrap:break-word}
/* 文節の 切れめで 折りかえす（Chrome 119 以降。Safari は ふつうの 折りかえし）。画面に スペースは 出ない */
.stem,.passage,.choices,.mondai p,.rv .stemsm,.script{word-break:auto-phrase}
/* ★の 4つの わく は 1行に まとめる */
.slots{display:inline-block;white-space:nowrap;margin:0 2px}
.slots .blank{min-width:2.4em}
.blank:empty::before{content:"\00a0"}
.stem u{text-decoration-thickness:1.5px;text-underline-offset:6px}
/* ルビ：タップしなくても 見える。行間は 上の line-height で 確保 */
ruby{ruby-position:over;ruby-align:center}
rt{font-size:.5em;line-height:1;font-family:var(--f-paper);font-weight:400;letter-spacing:0;user-select:none;-webkit-user-select:none}
.star{font-family:var(--f-ui)}
.word{display:inline-block;border:1.5px solid var(--ink);padding:0 12px;font-size:calc(20px*var(--z,1));line-height:2}
.blank{display:inline-block;min-width:3.2em;border-bottom:1.5px solid var(--ink);text-align:center;margin:0 2px}
.choices{display:flex;flex-wrap:wrap;gap:8px 22px;font-size:calc(17px*var(--z,1));line-height:2}
.choices.one{display:grid;grid-template-columns:1fr}
.choices div{display:flex;gap:8px;min-width:0}
.choices span.n{font-family:var(--f-ui);font-weight:700}
.note{font-size:12.5px;color:var(--muted);margin-top:14px}

/* answer-sheet strip */
.strip{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--sheet-bg);border-top:2px solid var(--sheet);padding-bottom:env(safe-area-inset-bottom,0px)}
.strip .in{max-width:560px;margin:0 auto;padding-block:10px 12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:10px}
.sheetlabel{display:flex;justify-content:space-between;font-size:11.5px;color:var(--sheet);letter-spacing:.08em}
.row{display:flex;align-items:center;gap:10px;background:transparent;border:0;padding:0;width:100%;color:inherit}
.row .no{width:2.2em;text-align:center;font-weight:700;color:var(--sheet);border:1.5px solid var(--sheet);font-size:13px;font-variant-numeric:tabular-nums}
.bubs{display:flex;gap:6px;flex:1;justify-content:center}
.bub{width:48px;height:52px;border:0;background:transparent;padding:0;display:grid;place-items:center;border-radius:8px}
.bub .ov{width:22px;height:40px;border-radius:50%;border:1.5px solid var(--sheet);color:var(--sheet);font-family:var(--f-paper);font-size:13px;display:grid;place-items:center;transition:background .12s}
.bub[aria-checked="true"] .ov{background:var(--ink);border-color:var(--ink);color:transparent}
.bub.is-right .ov{box-shadow:0 0 0 3px var(--ok)}
.nav{display:flex;gap:8px;justify-content:space-between}
.nav .mid{flex:1}

/* overview sheet */
.overlay{position:fixed;inset:0;z-index:20;background:rgb(0 0 0 / .4);display:grid;align-items:end}
.sheetpanel{background:var(--sheet-bg);max-height:85%;overflow:auto;border-radius:14px 14px 0 0;padding-block:16px calc(16px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheetpanel h2{font-size:15px;margin:0 0 4px;color:var(--sheet);letter-spacing:.1em}
.sheetpanel .grid{display:grid;gap:10px;margin:12px 0 16px;max-width:520px;margin-inline:auto}
.sheetpanel .head{display:flex;gap:8px;justify-content:space-between;align-items:center}

/* home / result */
h1{font-family:var(--f-paper);font-size:24px;margin:24px 0 4px;text-wrap:balance}
.lead{color:var(--muted);margin:0 0 18px;font-size:14px}
.card{background:var(--sheet-bg);border:1px solid var(--rule);border-radius:8px;padding:16px;display:grid;gap:8px;margin-bottom:12px}
.card h3{margin:0;font-size:16px}
.card p{margin:0;color:var(--muted);font-size:13.5px}
.card .meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.card h3 .idn{display:block;font-size:12.5px;font-weight:400;color:var(--muted)}
/* インドネシア語（小さく） */
.idt{display:block;font-size:12px;line-height:1.5;color:var(--muted);font-weight:400;font-family:var(--f-ui);letter-spacing:0}
.tag .idt,.pill .idt{display:inline;font-size:10.5px;color:inherit;opacity:.85;margin-left:4px}
button .idt{color:inherit;opacity:.85;font-size:11px}
.secscore .idt{display:inline;margin-left:4px}
.tot th .idt{font-size:10.5px}
.bars .idt{font-size:10.5px}
.brk{display:flex;align-items:center;gap:10px;margin:-2px 0 10px;color:var(--muted);font-size:13px}
.brk::before,.brk::after{content:"";flex:1;border-top:1px dashed var(--rule)}
.sched{font-variant-numeric:tabular-nums}
.score{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.score small{font-size:16px;color:var(--muted);font-weight:400}
.rv{border:1px solid var(--rule);border-radius:8px;background:var(--sheet-bg);padding:14px;display:grid;gap:8px;margin-bottom:10px}
.rv .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.ng{background:var(--ng-soft);color:var(--ng)}
.rv .stemsm{font-family:var(--f-paper);font-size:calc(16px*var(--z,1));line-height:2.1;overflow-wrap:break-word;line-break:strict}
.ex{font-size:13.5px;line-height:1.7}
.ex .id{color:var(--muted)}
.tabs{display:flex;gap:6px}
.tabs button{border:1px solid var(--rule);background:transparent;color:var(--muted);border-radius:99px;padding:3px 10px;font-size:12px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--sheet-bg);border-color:var(--ink)}

/* section score, total, verdict */
.secscore{display:flex;align-items:baseline;gap:6px;font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.secscore b{font-size:28px;color:var(--ink);line-height:1.1}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;margin-left:6px;vertical-align:2px}
.tag.done{background:var(--ok-soft);color:var(--ok)}
.tag.now{background:var(--sheet-soft);color:var(--ink)}
.card.flash{border:1.5px solid var(--accent)}
.card.flash p{color:var(--ink)}
.card.total{border:1.5px solid var(--ink)}
.tot{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.tot th,.tot td{border-bottom:1px solid var(--rule);padding:8px 4px;text-align:left;vertical-align:top}
.tot th{font-size:12px;color:var(--muted);font-weight:400}
.tot td.r,.tot th.r{text-align:right;white-space:nowrap}
.tot td b{font-size:18px}
.tot tr.sum td{border-bottom:0;font-weight:700}
.tot small{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.ok-t{color:var(--ok);font-weight:700}
.ng-t{color:var(--ng);font-weight:700}
.verdict{font-size:30px;font-weight:700;text-align:center;padding:12px;border-radius:8px;line-height:1.3}
.verdict small{display:block;font-size:13px;font-weight:400}
.verdict.pass{background:var(--ok-soft);color:var(--ok)}
.verdict.fail{background:var(--ng-soft);color:var(--ng)}
.card .why{color:var(--ng);font-weight:700;font-size:14px}
.card .why .idt{color:var(--ng);opacity:.85}
.card.total summary .idt{display:inline;margin-left:4px}
.btnrow{display:grid;gap:8px}
.bars{display:grid;gap:6px;font-size:13px;font-variant-numeric:tabular-nums;margin-top:8px}
.bars>div{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 3em;gap:8px;align-items:center}
.bars i{height:8px;background:var(--rule);border-radius:99px;overflow:hidden;display:block}
.bars i b{display:block;height:100%;background:var(--sheet)}
.bars>div>span:last-child{text-align:right}
details.more summary{cursor:pointer;font-size:13px;color:var(--muted)}

/* listening */
.player{margin-top:14px;display:grid;gap:10px}
.prog{height:6px;background:var(--rule);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--sheet);transition:width .25s linear}
.phase{font-size:13.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.phase b{color:var(--ink)}
.script{font-family:var(--f-paper);font-size:calc(15px*var(--z,1));line-height:2.1;display:grid;gap:4px}
.script .sp{font-family:var(--f-ui);font-size:12px;color:var(--muted);margin-right:6px}
.confirm{border:1.5px solid var(--sheet);background:var(--sheet-soft);border-radius:8px;padding:12px;display:grid;gap:10px;margin-top:14px}
.confirm p{margin:0;font-size:14px;color:var(--ink)}
.confirm .nav{justify-content:flex-end}
.who{display:grid;grid-template-columns:1fr 6.5em;gap:10px}
.who label{display:grid;gap:4px;font-size:12.5px;color:var(--muted);min-width:0}
.who input{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);width:100%;box-sizing:border-box}
.who input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.err{color:var(--ng);font-size:13px;margin:0}
.save{display:grid;gap:10px}
.save img{width:100%;border:1px solid var(--rule);border-radius:6px}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lvb{display:grid;gap:2px;text-align:center;padding:10px 6px;border:1.5px solid var(--rule);border-radius:8px;color:var(--ink);text-decoration:none;font-weight:700;font-size:18px}
.lvb small{font-weight:400;font-size:11.5px;color:var(--muted)}
.lvb.on{border-color:var(--ink);background:var(--sheet-soft)}
.lvb.off{opacity:.5}
.lvtabs{display:grid;grid-template-columns:repeat(var(--n,3),1fr);gap:0;border:1.5px solid var(--ink);border-radius:8px;overflow:hidden;margin:4px 0 14px}
.lvtabs button{border:0;border-left:1.5px solid var(--ink);background:transparent;color:var(--ink);font-weight:700;font-size:17px;padding:9px 4px;line-height:1.2}
.lvtabs button:first-child{border-left:0}
.lvtabs button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.lvtabs button[aria-pressed="true"]{background:var(--ink);color:var(--sheet-bg)}
.lvtabs button[aria-pressed="true"] small{color:var(--sheet-bg);opacity:.8}
a.tcard{color:var(--ink);text-decoration:none;grid-template-columns:1fr auto;align-items:center}
a.tcard .go{font-size:22px;color:var(--muted)}
a.tcard .meta b{color:var(--ink)}
.back{display:inline-block;margin:14px 0 0;color:var(--accent);font-size:14px;text-decoration:none;font-weight:700}
.one-field{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
.one-field input{font:inherit;font-size:16px;padding:9px 10px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink);width:100%}
.passage{font-family:var(--f-paper);font-size:calc(15.5px*var(--z,1));line-height:2.2;line-break:strict;overflow-wrap:break-word;border:1px solid var(--rule);border-radius:4px;padding:12px 14px;margin:4px 0 14px;max-height:42vh;overflow:auto;background:var(--paper)}
.passage .ttl{font-weight:700;margin:0 0 6px}
.passage p{margin:6px 0}
.info{border-collapse:collapse;width:100%;font-size:calc(13px*var(--z,1));line-height:1.9;font-family:var(--f-ui);table-layout:fixed}
.info td,.info th{overflow-wrap:break-word}
/* 文字の 大きさ ボタン */
.zbtn{font-family:var(--f-ui);min-width:2.6em}
.info th,.info td{border:1px solid var(--ink);padding:4px 5px;vertical-align:top}
.info th{background:var(--sheet-soft);font-weight:700}
.passage .mk{font-family:var(--f-ui);font-weight:700;padding:0 2px}
.passage .mk.cur{background:var(--ink);color:var(--sheet-bg);border-radius:3px}
.stem .blank{min-width:2.6em}
.pic{margin:8px 0 0}.pic img{width:100%;border:1px solid var(--rule);border-radius:4px}
.picalt{border:1px dashed var(--rule);border-radius:6px;padding:14px;font-size:14px;color:var(--muted);line-height:1.7;margin-top:8px}
.startrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.msel{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center}
.msel select{font:inherit;font-size:14px;padding:6px;border:1px solid var(--rule);border-radius:6px;background:var(--paper);color:var(--ink)}
.mhead{margin:18px 0 8px;font-size:15px}
.scr summary{cursor:pointer;font-size:13px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);margin-top:22px;line-height:1.7}
@media (prefers-reduced-motion: reduce){.bub,.prog i{transition:none}}
</style>
</head>
<body>

<header class="bar"><div class="in">
  <div class="sec" id="secName">JLPT 模擬試験</div>
  <div class="timer" id="timer" hidden></div>
  <button class="btn ghost small zbtn" id="zoomBtn" aria-label="文字の 大きさを かえる">あ＋</button>
  <button class="btn ghost small" id="openSheet" hidden>解答用紙</button>
</div></header>

<main class="wrap" id="app"></main>
<div class="strip" id="strip" hidden><div class="in" id="stripIn"></div></div>
<div class="overlay" id="overlay" hidden></div>

<script>
let SECS, LISTEN, S, SEC, BREAKS = [], SCORE;
let CATALOG = null, TEST = null, VERSION = "";
/* 得点区分（N4・N5）。N3 など 区分が ちがう ときは データの scoring で かえる */
const SCORE_DEFAULT = {lk:{name:"言語知識（文字・語彙・文法）・読解", max:120, min:38}, ls:{name:"聴解", max:60, min:19}, pass:90, total:180};
/* 得点区分を「区分の リスト（parts）」に そろえる。
   parts の src：{sec:"vocab"}＝その セクション ぜんぶ、{sec:"grammar", m:"文法"}＝大問名が「文法」で はじまる 問題だけ、{listen:true}＝聴解。
   データに parts が ない（N4・N5 の 書き方）ときは、2区分（言語知識・読解／聴解）に する */
function normScore(sc){
  if(sc && Array.isArray(sc.parts)) return sc;
  sc = sc || SCORE_DEFAULT;
  return {pass:sc.pass, total:sc.total, parts:[
    {key:"lk", name:"言語知識・読解", id:"Bahasa & Membaca", idLong:"Pengetahuan Bahasa & Membaca", max:sc.lk.max, min:sc.lk.min, src:[{all:true}]},
    {key:"ls", name:"聴解", id:"Mendengarkan", idLong:"Mendengarkan", max:sc.ls.max, min:sc.ls.min, src:[{listen:true}]}]};
}
function initState(){
  S = {name:"", view:"home", idx:0, ans:{}, done:{}, tend:{}, listen:0, timerEnd:0, timerId:0, ex:{}, playing:false, flash:""};
  SECS.forEach(sec => { S.ans[sec.id] = Array(sec.items.length).fill(0); S.done[sec.id] = false; });
  S.done.listen = false;
  S.lans = Array(LI().length).fill(0); S.lcur = 0;
}
const $ = id => document.getElementById(id);
const who = () => S.name || "No name";
const ID = t => `<span class="idt">${t}</span>`;
const KJ = () => !!TEST && ["N3","N2","N1"].includes(TEST.level);
const MDW = n => KJ() ? `問題${n}` : `もんだい${n}`;
const BANW = n => KJ() ? `${n}番` : `${n}ばん`;
const SHORT_ID = {vocab:"Kosakata", grammar:"Tata Bahasa & Membaca", listen:"Mendengarkan"};
const secShort = id => SHORT_ID[id] || secId(id);
const secId = id => id==="listen" ? (LISTEN.nameId || LISTEN.name) : (SECS.find(s=>s.id===id).nameId || SECS.find(s=>s.id===id).name);
/* 大問の 名前を インドネシア語に */
function mondaiId(k){
  const map = [["文字・語彙","Kosakata"],["文法","Tata bahasa"],["読解","Membaca"],["聴解","Mendengarkan"]];
  const f = map.find(([j])=>k.startsWith(j)); const n = (k.match(/(?:もんだい|問題)\s*(\d+)/)||[])[1];
  return f ? `${f[1]}${n?" – Mondai "+n:""}` : "";
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function setHeader(name, showSheet){ $("secName").textContent = name; $("openSheet").hidden = !showSheet; }

/* ---------- record (このスマホの ブラウザに のこす。リセットで けす) ---------- */
const recKey = () => "jlptRec:" + TEST.id;
function saveRec(){
  let sum = null;
  try{ const n = SECS.filter(s=>S.done[s.id]).length + (S.done.listen?1:0);
    sum = {done:n, of:SECS.length+1, started:n>0 || SECS.some(s=>S.ans[s.id].some(Boolean)) || S.lans.some(Boolean)};
    if(allDone()){ const T = totals(); sum.total = T.total; sum.max = SCORE.total; sum.pass = T.pass; } }catch(e){}
  try{ localStorage.setItem(recKey(), JSON.stringify({ans:S.ans, lans:S.lans, done:S.done, tend:S.tend, at:Date.now(), sum})); }catch(e){}
}
function loadRec(){
  try{
    const r = JSON.parse(localStorage.getItem(recKey()) || "null"); if(!r) return;
    SECS.forEach(sec => {
      const a = r.ans && r.ans[sec.id];
      if(Array.isArray(a) && a.length===sec.items.length){ S.ans[sec.id] = a; S.done[sec.id] = !!(r.done && r.done[sec.id]); }
    });
    if(Array.isArray(r.lans) && r.lans.length===S.lans.length){ S.lans = r.lans; S.done.listen = !!(r.done && r.done.listen); }
    S.tend = r.tend || {};
  }catch(e){}
}
function clearRec(){ try{ localStorage.removeItem(recKey()); }catch(e){} }

/* ---------- scores ---------- */
function secOk(id){
  if(id==="listen"){ const L = LI(); return {ok:L.filter(x=>S.lans[x.g]===x.it.a).length, n:L.length}; }
  const sec = SECS.find(s=>s.id===id);
  return {ok:sec.items.filter((q,i)=>S.ans[id][i]===q.a).length, n:sec.items.length};
}
const allDone = () => SECS.every(s=>S.done[s.id]) && S.done.listen;
/* 区分ごとの せいかい数と 点数（せいかいの 割合 × 満点。本番の 得点調整は ない ので 推定） */
function partCount(p){
  let ok = 0, n = 0;
  p.src.forEach(r => {
    if(r.listen){ const l = secOk("listen"); ok += l.ok; n += l.n; return; }
    SECS.forEach(sec => {
      if(!r.all && r.sec !== sec.id) return;
      sec.items.forEach((q,i) => { if(r.m && !q.m.startsWith(r.m)) return; n++; if(S.ans[sec.id][i]===q.a) ok++; });
    });
  });
  return {ok, n};
}
function totals(){
  const parts = SCORE.parts.map(p => { const c = partCount(p); const pts = c.n ? Math.round(c.ok/c.n*p.max) : 0; return {...p, ok:c.ok, n:c.n, pts, pass:pts>=p.min}; });
  const total = parts.reduce((a,p)=>a+p.pts,0), totalPass = total>=SCORE.pass;
  return {parts, total, totalPass, pass: totalPass && parts.every(p=>p.pass)};
}
function byMondai(){
  const out = [];
  SECS.forEach(sec => {
    const m = new Map();
    sec.items.forEach((q,i) => { const k = q.m.replace("　"," "); const o = m.get(k) || {k, kid:mondaiId(k), ok:0, n:0}; o.n++; if(S.ans[sec.id][i]===q.a) o.ok++; m.set(k,o); });
    out.push(...m.values());
  });
  const L = LI();
  LISTEN.mondai.forEach(md => { const o = {k:`聴解 ${MDW(md.no)}`, kid:`Mendengarkan – Mondai ${md.no}`, ok:0, n:0}; L.filter(x=>x.md===md).forEach(x=>{ o.n++; if(S.lans[x.g]===x.it.a) o.ok++; }); out.push(o); });
  return out;
}

/* ---------- timer ---------- */
function startTimer(endAt, onEnd){
  stopTimer();
  S.timerEnd = endAt;
  const t = $("timer"); t.hidden = false;
  const tick = () => {
    const left = Math.max(0, S.timerEnd - Date.now());
    const m = Math.floor(left/60000), s = Math.floor(left/1000)%60;
    t.textContent = "のこり " + String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
    t.classList.toggle("low", left < 60000);
    if(left <= 0){ stopTimer(); onEnd(); }
  };
  S.timerId = setInterval(tick, 500); tick();
}
function stopTimer(){ clearInterval(S.timerId); S.timerId = 0; $("timer").hidden = true; }

/* ---------- mark-sheet row ---------- */
function rowHTML(no, val, key, opts={}){
  const n = opts.n || 4;
  let b = "";
  for(let i=1;i<=n;i++){
    const right = opts.correct===i ? " is-right" : "";
    b += `<button class="bub${right}" role="radio" aria-checked="${val===i}" aria-label="${no}番 ${i}" data-k="${key}" data-v="${i}" ${opts.lock?"disabled":""}><span class="ov">${i}</span></button>`;
  }
  return `<div class="row" role="radiogroup" aria-label="問題 ${no}"><span class="no">${no}</span><div class="bubs">${b}</div></div>`;
}
function getAns(k){ if(k.startsWith("listen:")) return S.lans[+k.split(":")[1]]; const [sid,i]=k.split(":"); return S.ans[sid] ? S.ans[sid][+i] : 0; }
function setAns(k,v){ if(k.startsWith("listen:")){ S.lans[+k.split(":")[1]]=v; saveRec(); return; } const [sid,i]=k.split(":"); if(S.ans[sid]){ S.ans[sid][+i]=v; saveRec(); } }
document.addEventListener("click", e => {
  const b = e.target.closest(".bub"); if(!b || b.disabled) return;

}

/* 合計点と 合否判定（3つ ぜんぶ おわったら） */
function totalCard(){
  const T = totals();
  const mark = p => p ? `<span class="ok-t">○</span>` : `<span class="ng-t">×</span>`;
  const why = [];
  T.parts.forEach(p => { if(!p.pass) why.push([`${p.name}が 基準点に とどいていません`, `${p.id} belum mencapai nilai minimum`]); });
  if(!T.totalPass) why.push(["総合が 合格点に とどいていません", "Nilai total belum mencapai batas lulus"]);
  const bars = byMondai().map(o=>`<div><span>${o.k}${o.kid?ID(o.kid):""}</span><i><b style="width:${Math.round(o.ok/o.n*100)}%"></b></i><span>${o.ok}/${o.n}</span></div>`).join("");
  return `<div class="card total" id="totalCard">
    <h3>合計点と 合否判定<span class="idn">Nilai total dan hasil</span></h3>
    <div class="verdict ${T.pass?"pass":"fail"}">${T.pass?"合格":"不合格"}<small>（推定）${T.pass?"LULUS":"TIDAK LULUS"}</small></div>
    ${why.map(([j,i])=>`<p class="why">${j}${ID(i)}</p>`).join("")}
    <table class="tot">
      <thead><tr><th>区分</th><th class="r">点数${ID("Nilai")}</th><th class="r">基準点${ID("Minimum")}</th></tr></thead>
      <tbody>
        ${T.parts.map(p=>`<tr><td>${p.name}${ID(p.id)}</td><td class="r"><b>${p.pts}</b> / ${p.max}<small>${p.ok}/${p.n}問</small></td><td class="r">${p.min} ${mark(p.pass)}</td></tr>`).join("")}
        <tr class="sum"><td>総合${ID("Total")}</td><td class="r"><b>${T.total}</b> / ${SCORE.total}</td><td class="r">${SCORE.pass} ${mark(T.totalPass)}</td></tr>
      </tbody>
    </table>
    <details class="more"><summary>※ 推定の 点数です（くわしく）${ID("Nilai perkiraan (detail)")}</summary>
      <p class="meta">本番は 得点調整が あるので、せいかいの 数から 出した 目安です。合格は、総合 ${SCORE.pass}点 以上、かつ ${T.parts.length===2?"2つの":"すべての"} 区分が 基準点 以上。${ID(`Ujian sebenarnya memakai penyesuaian nilai. Lulus jika total ${SCORE.pass}+ dan ${T.parts.length===2?"kedua":"semua"} bagian mencapai minimum.`)}</p></details>
    <details class="more"><summary>大問ごとの せいかい${ID("Benar per mondai")}</summary><div class="bars">${bars}</div></details>
    <div class="btnrow"><button class="btn" id="dlTotal">⬇ 結果の 画像を 保存する${ID("Simpan gambar hasil")}</button><button class="btn ghost" id="dlReview">⬇ まちがえた 問題を ダウンロードする${ID("Unduh soal yang salah (untuk latihan ulang)")}</button></div>
    <details class="more"><summary>画像を 見る（保存できないときは 長おし）${ID("Lihat gambar (tekan lama untuk simpan)")}</summary>
      <img id="totalPv" alt="結果の画像" style="width:100%;border:1px solid var(--rule);border-radius:6px;margin-top:6px"></details>
  </div>`;
}

/* ファイル名は 英数字だけに する（日本語の 名前だと 保存できない ブラウザが ある） */
function fileName(){ return (S.name||"").normalize("NFKD").replace(/[^A-Za-z0-9._-]+/g,"_").replace(/^_+|_+$/g,"") || "NoName"; }
function downloadBlob(text, type, filename){
  const url = URL.createObjectURL(new Blob([text], {type}));
  const a = document.createElement("a"); a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}

/* 本番の 時間わり（テストと 休憩の 合計） */
function schedCard(){
  const BRK = BREAKS; if(!BRK.length) return "";
  const mins = SECS.map(s=>s.minutes).concat([LISTEN.minutes]);
  const total = mins.reduce((a,b)=>a+b,0) + BRK.reduce((a,b)=>a+b,0);
  const h = Math.floor(total/60), m = total%60;
  return `<div class="card sched">
    <h3>本番の 時間<span class="idn">Waktu ujian yang sebenarnya</span></h3>
    <p>テスト ${mins.join("分 → ")}分 の あいだに、休憩が ${BRK.length}回 あります。ぜんぶで やく ${h}時間${m?m+"分":""}です（せつめいの 時間は のぞく）。</p>
    <p>Ada ${BRK.length} kali istirahat di antara tes. Totalnya sekitar ${h} jam${m?" "+m+" menit":""} (tidak termasuk waktu penjelasan).</p>
  </div>`;
}

/* ---------- paper (one question) ---------- */
function passageHTML(pid, cur, sec){
  sec = sec || SEC;
  const p = sec.passages && sec.passages[pid]; if(!p) return "";
  const html = p.replace(/\{(Q\d+)\}/g, (m, k) => { const n = +k.slice(1); return `<span class="mk${n===cur?" cur":""}">［${n}］</span>`; });
  const body = /<table|<p/.test(html) ? html : html.replace(/\n/g, "<br>");
  return `<div class="passage">${body}</div>`;
}
function question(i){
  S.view="q"; S.idx=i;
  setHeader(SEC.name, true);
  if(!S.timerId){
    // 時間は スマホに のこす（とちゅうで ページを とじても 時間は すすむ）
    if(!S.tend[SEC.id]){ S.tend[SEC.id] = Date.now() + SEC.minutes*60000; saveRec(); }
    startTimer(S.tend[SEC.id], () => submitSec(true));
    if(S.view!=="q") return; // 時間が もう おわって いた
  }
  const q = SEC.items[i], no = i+1;

  const showIns = !prev || prev.m !== q.m || q.passage;
  $("app").innerHTML = `
    <section class="paper" aria-label="もんだいようし">
      ${showIns ? `<div class="mondai"><b>${q.m.split("　")[1]}</b><p>${q.ins}</p></div>` : ""}
      ${q.passage ? passageHTML(q.passage, no) : ""}
      <div class="stem"><span class="qnum">${no}</span>${q.stem || ""}</div>
      <div class="choices ${q.one?"one":""}">${q.ch.map((c,k)=>`<div><span class="n">${k+1}</span><span>${c}</span></div>`).join("")}</div>
      <p class="note">${q.m}</p>
    </section>`;

/* ---------- audio engine: decode, trim edge silence, schedule with exact gaps ---------- */
/* iPhone では 画面が 消えると 音声（AudioContext）が 止まる。止まったのを 見つけたら、
   のこりの 音を 止めて onIntr(番号) を よぶ（その 番から やりなおせる）。
   つぎに タップした とき、止まった AudioContext は すてて 新しく 作る */
let ctx = null, sources = [], uiTimer = 0, curPlay = null, ctxBroken = false;
const BUF = {};
function ensureCtx(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(ctx && (ctxBroken || ctx.state === "closed" || ctx.state === "interrupted")){ try{ ctx.close(); }catch(e){} ctx = null; }
  ctxBroken = false;
  if(!ctx){ ctx = new AC(); ctx.onstatechange = () => { if(curPlay && ctx && ctx.state !== "running") interruptAudio(); }; }
  return ctx.resume();
}
function interruptAudio(){
  const p = curPlay; if(!p) return;
  ctxBroken = true; stopAudio();
  if(p.onIntr) p.onIntr(p.g);
}
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "hidden") interruptAudio(); });
window.addEventListener("pagehide", interruptAudio);
/* 画面を 消さない（Wake Lock。iPhone は iOS 16.4 から） */
let wake = null;
async function wakeOn(){
  try{ if("wakeLock" in navigator && !wake){ wake = await navigator.wakeLock.request("screen"); wake.addEventListener("release", () => { wake = null; }); } }catch(e){}
}
function wakeOff(){ try{ if(wake) wake.release(); }catch(e){} wake = null; }
document.addEventListener("visibilitychange", () => { if(document.visibilityState === "visible" && S && S.playing) wakeOn(); });
async function loadBuffers(names){
  const need = [...new Set(names)].filter(k=>!BUF[k]);
  await Promise.all(need.map(async k => {
    const res = await fetch(`audio/${k}.mp3?v=${encodeURIComponent(VERSION)}`);
    if(!res.ok) throw new Error("audio " + k);
    const ab = await res.arrayBuffer();
    const buf = await new Promise((ok,ng)=>ctx.decodeAudioData(ab, ok, ng));
    BUF[k] = {buf, ...edges(buf, k.includes("chime"))};
  }));
}
function edges(buf, keepTail){
  const d = buf.getChannelData(0), th = 0.012, sr = buf.sampleRate;
  let s = 0, e = d.length-1;
  while(s<d.length && Math.abs(d[s])<th) s++;
  while(e>s && Math.abs(d[e])<th) e--;
  const pad = 0.03*sr;
  s = Math.max(0, s-pad); e = keepTail ? d.length-1 : Math.min(d.length-1, e+pad);
  return {off:s/sr, dur:(e-s)/sr};
}
/* ensureCtx() は タップの 中で すぐ よぶ ため、この 関数の 最初（await の 前）に おく */
async function playTimeline(steps, onEnd, onPhase, onError, onIntr){
  stopAudio();
  try{
    const rs = ensureCtx();
    await Promise.race([rs, new Promise(r => setTimeout(r, 3000))]);
    if(ctx.state !== "running") throw new Error("not running");
    await loadBuffers(steps.map(s=>s.f));
    if(ctx.state !== "running") throw new Error("not running");
  }catch(e){
    ctxBroken = true;
    if(onError) onError("音声を はじめられませんでした。もう一度 おして ください。だめな ときは、ページを 読みこみなおして ください。");
    return;
  }
  stopAudio();
  let t = ctx.currentTime + 0.4;
  const t0 = t, marks = [];
  for(const step of steps){
    const b = BUF[step.f];
    const src = ctx.createBufferSource(); src.buffer = b.buf; src.connect(ctx.destination);
    src.start(t, b.off, b.dur); sources.push(src);
    marks.push({t, ph:step.ph, g:step.g});
    t += b.dur;
    if(step.ans) marks.push({t, ph:"解答時間", ans:t+step.gap, g:step.g});
    t += step.gap;
  }
  const tEnd = t;
  const play = curPlay = {onIntr, g:steps.length ? steps[0].g : null};
  let lastNow = ctx.currentTime, lastWall = Date.now();
  const tick = () => {
    if(curPlay !== play) return;
    const now = ctx.currentTime;
    if(now >= tEnd){ clearInterval(uiTimer); curPlay = null; onEnd(); return; }
    /* 止まって いる：AudioContext が 動いて いない、または 時間が 3秒 以上 すすまない */
    if(document.visibilityState === "hidden" || ctx.state !== "running"){ interruptAudio(); return; }
    if(now !== lastNow){ lastNow = now; lastWall = Date.now(); }
    else if(Date.now() - lastWall > 3000){ interruptAudio(); return; }
    let cur = marks[0];
    for(const m of marks) if(now >= m.t) cur = m;
    play.g = cur.g;
    const left = cur.ans ? Math.ceil(cur.ans - now) : null;
    onPhase(now < t0 ? "まもなく はじまります" : cur.ph, left, (now-t0)/(tEnd-t0), cur.g);
  };
  clearInterval(uiTimer); uiTimer = setInterval(tick, 200); tick();
}
function stopAudio(){
  clearInterval(uiTimer); curPlay = null;
  sources.forEach(s=>{ try{s.stop()}catch(e){} }); sources = [];
}

const CM = '"BIZ UDMincho","Hiragino Mincho ProN",serif', CG = '"BIZ UDPGothic","Hiragino Sans",sans-serif';
async function drawResult(which){
  try{ await document.fonts.ready; }catch(e){}
  const sec = which==="listen" ? null : SECS.find(s=>s.id===which);
  const rows = sec
    ? sec.items.map((q,i)=>({no:String(i+1), kind:q.m.replace("　"," "), me:S.ans[sec.id][i], a:q.a}))
    : LI().map(x=>({no:`${x.it.no}`, kind:`聴解 ${MDW(x.md.no)}`, me:S.lans[x.g], a:x.it.a}));
  const ok = rows.filter(r=>r.me===r.a).length;
  const W=1080, rowH=76, top=400, H=top+rows.length*rowH+150;
  const c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d");
  const M=CM, G=CG;
  g.fillStyle="#ffffff"; g.fillRect(0,0,W,H);
  g.strokeStyle="#1c2125"; g.lineWidth=4; g.strokeRect(24,24,W-48,H-48);
  g.fillStyle="#1c2125"; g.textBaseline="alphabetic";
  g.font=`700 44px ${M}`; g.fillText(`JLPT ${TEST.level} 模擬試験　結果`, 64, 110);
  g.font=`400 30px ${G}`; g.fillStyle="#5b646c";
  g.fillText(sec ? sec.name : "聴解", 64, 160); g.font=`400 22px ${G}`; g.fillText(secId(sec ? sec.id : "listen"), 64, 192);
  g.fillStyle="#1c2125"; g.font=`700 36px ${G}`;
  g.fillText(who(), 64, 236);
  g.font=`400 28px ${G}`; g.fillStyle="#5b646c"; g.fillText(stamp().txt, 64, 284);
  g.fillStyle="#1c2125"; g.font=`700 96px ${G}`; const sc=String(ok); g.fillText(sc, W-330, 250);
  const sw=g.measureText(sc).width; g.font=`400 36px ${G}`; g.fillStyle="#5b646c"; g.fillText(` / ${rows.length}問`, W-330+sw, 250);
  g.font=`400 22px ${G}`; g.fillText(`Benar ${ok} dari ${rows.length} soal`, W-330, 290);
  g.fillStyle="#1c2125"; g.font=`700 26px ${G}`;
  const cols=[64,170,690,830,960];
  ["番号","問題","あなた","こたえ","結果"].forEach((t,i)=>g.fillText(t, cols[i], top-50));
  g.fillStyle="#5b646c"; g.font=`400 20px ${G}`; ["No.","Soal","Jawabanmu","Kunci","Hasil"].forEach((t,i)=>g.fillText(t, cols[i], top-22));
  g.fillRect(56, top-8, W-112, 3);
  rows.forEach((r,i)=>{
    const y=top+i*rowH+50, good=r.me===r.a;
    if(i%2===1){ g.fillStyle="#f2f4f2"; g.fillRect(56, y-50+3, W-112, rowH); }
    g.fillStyle="#1c2125"; g.font=`700 30px ${G}`; g.fillText(r.no, cols[0], y);
    g.font=`400 28px ${G}`; g.fillText(r.kind, cols[1], y);
    g.font=`700 30px ${G}`; g.fillText(r.me?String(r.me):"－", cols[2]+20, y); g.fillText(String(r.a), cols[3]+20, y);
    g.fillStyle=good?"#2e7a4e":"#b3261e"; g.font=`700 34px ${G}`; g.fillText(good?"○":"×", cols[4]+14, y);
  });
  g.fillStyle="#5b646c"; g.font=`400 24px ${G}`;
  g.fillText(`IJFA トレーニングセンター　JLPT ${TEST.level} ${TEST.title}`, 64, H-64);
  return c;
}
async function setupSave(which){
  const c = await drawResult(which);
  const url = c.toDataURL("image/png");
  const pv = $("pv"); if(pv) pv.src = url;
  const b = $("dl"); if(!b) return;
  b.onclick = () => {
    const safe = fileName();
    const a = document.createElement("a");
    a.href = url; a.download = `JLPT-${TEST.level}_${which}_${safe}_${stamp().file}.png`;
    document.body.appendChild(a); a.click(); a.remove();
  };
}
/* 合計点と 合否判定の 画像 */
async function drawTotal(){
  try{ await document.fonts.ready; }catch(e){}
  const T = totals(), MD = byMondai();
  const NP = T.parts.length, ty=380, sumY = ty+80+NP*90+2, top = sumY+158;
  const W=1080, rowH=66, H=top+MD.length*rowH+200;
  const c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d");
  const INK="#1c2125", MUT="#5b646c", OK="#2e7a4e", NG="#b3261e";
  g.fillStyle="#ffffff"; g.fillRect(0,0,W,H);
  g.strokeStyle=INK; g.lineWidth=4; g.strokeRect(24,24,W-48,H-48);
  g.textBaseline="alphabetic";
  g.fillStyle=INK; g.font=`700 44px ${CM}`; g.fillText(`JLPT ${TEST.level} 模擬試験　合否判定`, 64, 110);
  g.fillStyle=MUT; g.font=`400 28px ${CG}`; g.fillText(TEST.title, 64, 156);
  g.font=`400 22px ${CG}`; g.fillText("Hasil ujian coba JLPT (perkiraan)", 64, 188);
  g.fillStyle=INK; g.font=`700 38px ${CG}`; g.fillText(who(), 64, 232);
  g.fillStyle=MUT; g.font=`400 28px ${CG}`; g.fillText(stamp().txt, 64, 278);
  // 判定
  const vx=W-404, vy=176, vw=340, vh=130, col=T.pass?OK:NG;
  g.fillStyle=T.pass?"#e3f1e8":"#f8e2e0"; g.fillRect(vx,vy,vw,vh);
  g.strokeStyle=col; g.lineWidth=4; g.strokeRect(vx,vy,vw,vh);
  g.fillStyle=col; g.textAlign="center";
  g.font=`700 64px ${CG}`; g.fillText(T.pass?"合格":"不合格", vx+vw/2, vy+76);
  g.font=`400 24px ${CG}`; g.fillText(`（推定）${T.pass?"LULUS":"TIDAK LULUS"}`, vx+vw/2, vy+112);
  g.textAlign="left";
  // 区分の 表
  const cols=[64,500,670,830];
  g.fillStyle=MUT; g.font=`400 24px ${CG}`;
  ["区分","せいかい","点数（推定）","基準点"].forEach((t,i)=>g.fillText(t, cols[i], ty-26));
  g.font=`400 19px ${CG}`; ["Bagian","Benar","Nilai","Minimum"].forEach((t,i)=>g.fillText(t, cols[i], ty));
  g.fillStyle=INK; g.fillRect(56, ty+16, W-112, 3);
  const line = (y, name, okTxt, pts, max, crit, pass, bold, nid) => {
    g.fillStyle=INK; g.font=`${bold?700:400} 30px ${CG}`; g.fillText(name, cols[0], y-10);
    g.fillStyle=MUT; g.font=`400 20px ${CG}`; g.fillText(nid, cols[0], y+20); g.fillStyle=INK;
    g.font=`400 28px ${CG}`; if(okTxt) g.fillText(okTxt, cols[1], y);
    g.font=`700 40px ${CG}`; const p=String(pts); g.fillText(p, cols[2], y);
    const pw=g.measureText(p).width; g.font=`400 26px ${CG}`; g.fillStyle=MUT; g.fillText(` / ${max}`, cols[2]+pw, y);
    g.fillStyle=INK; g.font=`400 26px ${CG}`; g.fillText(crit, cols[3], y);
    g.fillStyle=pass?OK:NG; g.font=`700 34px ${CG}`; g.fillText(pass?"○":"×", W-92, y);
  };
  T.parts.forEach((p,i) => {
    const y = ty+80+i*90;
    line(y, p.name, `${p.ok}/${p.n}`, p.pts, p.max, String(p.min), p.pass, false, p.idLong||p.id);
    if(i<NP-1){ g.fillStyle="#d5dad6"; g.fillRect(56, y+28, W-112, 2); }
  });
  g.fillStyle=INK; g.fillRect(56, sumY-64, W-112, 3);
  line(sumY, "総合得点", "", T.total, SCORE.total, `合格点 ${SCORE.pass}`, T.totalPass, true, `Nilai total (batas lulus ${SCORE.pass})`);
  // 大問ごと
  g.fillStyle=INK; g.font=`700 28px ${CG}`; g.fillText("大問ごとの せいかい", 64, top-48); g.fillStyle=MUT; g.font=`400 20px ${CG}`; g.fillText("Jawaban benar per mondai", 64, top-18);
  MD.forEach((o,i)=>{
    const y=top+i*rowH+36, r=o.ok/o.n;
    g.fillStyle=INK; g.font=`400 26px ${CG}`; g.fillText(o.k, 64, y-6);
    g.fillStyle=MUT; g.font=`400 18px ${CG}`; g.fillText(o.kid||"", 64, y+18);
    g.fillStyle="#e4e8e5"; g.fillRect(470, y-20, 400, 18);
    g.fillStyle=INK; g.fillRect(470, y-20, Math.round(400*r), 18);
    g.font=`700 26px ${CG}`; g.textAlign="right"; g.fillText(`${o.ok}/${o.n}`, W-64, y); g.textAlign="left";
  });
  g.fillStyle=MUT; g.font=`400 22px ${CG}`;
  g.fillText("点数は せいかいの 数から 出した 目安です（本番は 得点調整が あります）。", 64, H-130);
  g.fillText("Nilai ini perkiraan dari jumlah jawaban benar (ujian sebenarnya memakai penyesuaian nilai).", 64, H-98);
  g.fillText(`IJFA トレーニングセンター　JLPT ${TEST.level} ${TEST.title}`, 64, H-60);
  return c;
}

/* ---------- まちがえた 問題（やりなおし用の ファイル） ---------- */
function reviewHTML(){
  const T = totals(), base = location.href.split(/[?#]/)[0].replace(/[^/]*$/, "");
  const det = (ansTxt, ja, id, extra="") => `<details><summary>こたえと せつめいを 見る ／ Lihat jawaban</summary>
      <p class="ans">こたえ：${ansTxt}<span class="idt">Jawaban benar</span></p><p>${ja}</p><p class="id">${id}</p>${extra}</details>`;
  let body = "", count = 0;
  SECS.forEach(sec => {
    const wrong = sec.items.map((q,i)=>({q, i, me:S.ans[sec.id][i]})).filter(x=>x.me!==x.q.a);
    if(!wrong.length) return;
    body += `<h2>${sec.name}<span>${wrong.length}問</span></h2><p class="note">${secId(sec.id)} – ${wrong.length} soal</p>`;
    const shown = new Set();
    wrong.forEach(({q,i,me}) => {
      count++;
      const pas = q.passage && !shown.has(q.passage) ? (shown.add(q.passage), passageHTML(q.passage, -1, sec)) : "";
      body += `${pas}<div class="q"><div class="top"><b class="no">${i+1}</b><span>${q.m}　${mondaiId(q.m)}</span></div>
        <p class="ins">${q.ins}</p>
        ${q.stem ? `<div class="stem">${q.stem}</div>` : ""}
        <ol class="ch">${q.ch.map(c=>`<li>${c}</li>`).join("")}</ol>
        <p class="me">あなたの こたえ：${me ? me : "ぬっていない"}<span class="idt">Jawabanmu: ${me ? me : "tidak diisi"}</span></p>
        ${det(`${q.a}　${q.ch[q.a-1]}`, q.ja, q.id)}</div>`;
    });
  });
  const L = LI(), lw = L.filter(x=>S.lans[x.g]!==x.it.a);
  if(lw.length){
    body += `<h2>${LISTEN.name}<span>${lw.length}問</span></h2><p class="note">音声は JLPTの ページの 答えあわせで もう一度 聞けます。スクリプトは せつめいの 中に あります。<span class="idt">Audio bisa didengar lagi di pembahasan pada halaman JLPT. Naskah ada di dalam penjelasan.</span></p>`;
    lw.forEach(x => {
      count++;
      const it = x.it, me = S.lans[x.g];
      const pic = it.img ? `<img src="${base}${it.img}" alt="${esc(it.imgDesc||"")}">` : "";
      const scr = `<div class="scr">${it.script.map(([s,t])=>`<div>${s?`<b>${s}</b> `:""}${t}</div>`).join("")}</div>`;
      body += `<div class="q"><div class="top"><b class="no">${BANW(it.no)}</b><span>聴解 ${MDW(x.md.no)}　Mendengarkan – Mondai ${x.md.no}</span></div>
        ${pic}<ol class="ch">${it.ch.map(c=>`<li>${c}</li>`).join("")}</ol>
        <p class="me">あなたの こたえ：${me ? me : "ぬっていない"}<span class="idt">Jawabanmu: ${me ? me : "tidak diisi"}</span></p>
        ${det(`${it.a}　${it.ch[it.a-1]}`, it.ja, it.id, scr)}</div>`;
    });
  }
  if(!count) body = `<p class="good">まちがえた 問題は ありません。すばらしい！<span class="idt">Tidak ada soal yang salah. Hebat!</span></p>`;
  return `<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>まちがえた問題｜JLPT ${TEST.level} ${esc(TEST.title)}｜${esc(who())}</title>
<style>
body{margin:0;background:#f6f7f5;color:#1c2125;font-family:"Hiragino Sans","Yu Gothic","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.7}
.wrap{max-width:640px;margin:0 auto;padding:16px 16px 48px}
h1{font-size:21px;margin:8px 0 4px}h2{font-size:17px;margin:28px 0 10px;border-bottom:2px solid #1c2125;padding-bottom:4px;display:flex;justify-content:space-between}
h2 span{font-size:13px;font-weight:400;color:#5b646c}
.sum{background:#fff;border:1px solid #d5dad6;border-radius:8px;padding:12px 14px;font-size:14px}
.sum b{font-size:17px}.pass{color:#2e7a4e;font-weight:700}.fail{color:#b3261e;font-weight:700}
.q{background:#fff;border:1px solid #d5dad6;border-radius:8px;padding:14px;margin-bottom:12px}
.top{display:flex;gap:10px;align-items:center;font-size:12.5px;color:#5b646c}.no{border:1.5px solid #1c2125;color:#1c2125;padding:0 7px;font-size:13px}
.ins{font-size:12.5px;color:#5b646c;margin:6px 0}.stem{font-size:18px;line-height:2.2;margin:6px 0}
.stem u{text-underline-offset:5px}.word{display:inline-block;border:1.5px solid #1c2125;padding:0 10px}
.blank{display:inline-block;min-width:2.6em;border-bottom:1.5px solid #1c2125;margin:0 2px;text-align:center}
.ch{margin:6px 0;padding-left:1.8em;font-size:16px}.ch li{margin:2px 0}
.me{font-size:13.5px;color:#b3261e;margin:6px 0}
details{border-top:1px dashed #d5dad6;margin-top:8px;padding-top:6px}summary{cursor:pointer;color:#22385a;font-weight:700;font-size:14px}
.ans{font-weight:700;color:#2e7a4e}.id{color:#5b646c}
.passage{background:#fff;border:1px solid #d5dad6;border-radius:4px;padding:12px 14px;margin:0 0 12px;line-height:2.2}
ruby{ruby-position:over}rt{font-size:.5em;line-height:1}
.stem,.ch,.passage,.scr{line-break:strict;overflow-wrap:break-word}.ch li{line-height:2}
.passage .ttl{font-weight:700}.passage .mk{font-weight:700}
.info{border-collapse:collapse;width:100%;font-size:13px;line-height:1.9;table-layout:fixed}.info th,.info td{border:1px solid #1c2125;padding:4px}
img{max-width:100%;border:1px solid #d5dad6;border-radius:4px;margin:6px 0}
.scr{font-size:14px;background:#f6f7f5;border-radius:6px;padding:8px 10px;margin-top:6px}.scr b{font-size:12px;color:#5b646c}
.note{font-size:13px;color:#5b646c}.good{font-size:18px;font-weight:700;color:#2e7a4e}
.foot{font-size:12px;color:#5b646c;margin-top:28px}
.idt{display:block;font-size:12px;color:#5b646c;font-weight:400;line-height:1.5}.ans .idt,.me .idt{display:inline;margin-left:6px}
</style></head><body><div class="wrap">
<h1>まちがえた 問題 ／ Soal yang salah</h1>
<p class="note">JLPT ${TEST.level} ${esc(TEST.title)}　${esc(who())}　${stamp().txt}</p>
<div class="sum">判定：<span class="${T.pass?"pass":"fail"}">${T.pass?"合格":"不合格"}（推定）</span>　総合 <b>${T.total}</b>/${SCORE.total}
<span class="idt">Hasil: ${T.pass?"LULUS":"TIDAK LULUS"} (perkiraan) ／ Nilai total ${T.total}/${SCORE.total}</span>
${T.parts.map(p=>`${p.name} ${p.pts}/${p.max}（基準点 ${p.min}）`).join("　")}
<span class="idt">${T.parts.map(p=>`${p.idLong||p.id} ${p.pts}/${p.max} (minimum ${p.min})`).join(" ／ ")}</span>
まちがえた 問題・ぬらなかった 問題：${count}問<span class="idt">Soal yang salah atau tidak diisi: ${count}</span></div>
<p class="note">まず 自分で もう一度 といて から、「こたえと せつめいを 見る」を おして ください。<br>Coba jawab lagi dulu, lalu tekan "Lihat jawaban".</p>
${body}
<p class="foot">IJFA トレーニングセンター　JLPT ${TEST.level} ${esc(TEST.title)}</p>
</div></body></html>`;
}

/* 文字の 大きさ（100%・115%・130%）。この スマホに おぼえる */
const ZOOMS = [1, 1.15, 1.3];
function applyZoom(z){ document.documentElement.style.setProperty("--z", z); $("zoomBtn").textContent = z>1 ? `あ ${Math.round(z*100)}%` : "あ＋"; }
(function(){
  let z = 1; try{ z = +localStorage.getItem("jlptZoom") || 1; }catch(e){}
  if(!ZOOMS.includes(z)) z = 1; applyZoom(z);
  $("zoomBtn").onclick = () => { const cur = +getComputedStyle(document.documentElement).getPropertyValue("--z") || 1;
    const nz = ZOOMS[(ZOOMS.indexOf(cur)+1) % ZOOMS.length]; applyZoom(nz); try{ localStorage.setItem("jlptZoom", nz); }catch(e){} };
})();
async function boot(){
  try{
    CATALOG = await (await fetch("catalog.json?t=" + Date.now())).json();
    const all = CATALOG.levels.flatMap(l => l.tests.map(t => ({...t, level:l.level})));
    const want = new URLSearchParams(location.search).get("t");
    TEST = all.find(t => t.id === want);
    if(!TEST){ topPage(); return; }
    try{ localStorage.setItem("jlptLv", TEST.level); }catch(e){}
    /* データの 中の {漢字|かんじ} を ルビ（<ruby>）に する。{Q18} の ような 番号の 印は そのまま */
    const raw = await (await fetch(TEST.id + ".json?t=" + Date.now())).text();
    const data = JSON.parse(raw.replace(/\{([^{}|"\\]+)\|([^{}|"\\]+)\}/g, "<ruby>$1<rt>$2</rt></ruby>"));
    /* ★の わく（.blank が 4つ ならぶ ところ）を まとめて、スマホでも 1行で 見えるように する */
    data.sections.forEach(sec => sec.items.forEach(q => { if(q.stem) q.stem = q.stem.replace(/((?:<span class="blank[^"]*">[^<]*<\/span>\s*){3}<span class="blank[^"]*">[^<]*<\/span>)/, '<span class="slots">$1</span>'); }));
    SECS = data.sections; LISTEN = data.listen; VERSION = data.version || ""; BREAKS = data.breaks || [];
    SCORE = normScore(data.scoring);
  }catch(e){
    $("app").innerHTML = '<p class="lead" style="margin-top:24px">問題を 読みこめませんでした。インターネットの 接続を たしかめて、ページを 読みこみなおして ください。</p>';
    return;
  }
  initState();
  try{ S.name = localStorage.getItem("jlptName") || ""; }catch(e){}
  loadRec();
  home();
}
boot();
</script>
